map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
map $uri $robots_header {
    default "";
    ~^/(admin|tanulo|belepes|adatkezeles|impresszum|programozas-izelito)(/|$) "noindex, nofollow";
}
map $uri $response_cache_control {
    default "no-cache";
    ~^/(api|admin|tanulo|belepes)(/|$) "no-store";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 21m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_header always;
    add_header Cache-Control $response_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        # Re-resolve after a backend-only container replacement.
        set $api_backend http://backend:8080;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Production ingress must be Cloudflare Tunnel only; no public host ports.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Host $host;
        # Spring also accepts these alternatives. Never forward client-supplied
        # values that could override our trusted host/protocol/client address.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_read_timeout 60s;
    }
    location ~ ^/(jelentkezes|kurzusok|szuloknek|diakoknak|erettsegi-feladatsorok|programozas-izelito|oktatas-menete|oktatok|arak|gyik|helyszin|kapcsolat|adatkezeles|impresszum|belepes|tanulo|admin)/(?:index.html)?$ { return 301 /$1$is_args$args; }
    location = /index.html {
        if ($request_uri ~ ^/index\.html(?:\?|$)) { return 301 /$is_args$args; }
    }
    location = / { try_files /index.html =404; }
    location ~ ^/(jelentkezes|kurzusok|szuloknek|diakoknak|erettsegi-feladatsorok|programozas-izelito|oktatas-menete|oktatok|arak|gyik|helyszin|kapcsolat|adatkezeles|impresszum|belepes|tanulo|admin)$ {
        try_files $uri/index.html =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
}
